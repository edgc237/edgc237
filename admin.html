<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — EDGC237 DSSC</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#0A5C0A;--gold:#F9C300;--navy:#0D1B2A;--red:#CE1126;}
body{font-family:'DM Sans',sans-serif;background:#f7f5ef;color:var(--navy);min-height:100vh;padding:24px;}
.wrap{max-width:820px;margin:0 auto;}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 12px 48px rgba(0,0,0,0.08);}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:800;margin-bottom:6px;}
.sub{color:rgba(13,27,42,0.55);font-size:0.88rem;margin-bottom:24px;}
label{display:block;font-size:0.83rem;font-weight:700;margin-bottom:6px;margin-top:16px;}
input{width:100%;padding:12px 14px;border:1.5px solid rgba(13,27,42,0.15);border-radius:8px;font-size:0.9rem;}
button{background:var(--gold);color:var(--navy);border:none;padding:13px 22px;border-radius:8px;font-weight:800;font-size:0.9rem;margin-top:18px;cursor:pointer;}
button:disabled{opacity:0.6;}
.msg.error{margin-top:14px;padding:12px 14px;border-radius:8px;background:rgba(206,17,38,0.08);color:var(--red);font-size:0.85rem;}
.step{display:none;}
.step.show{display:block;}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:0.85rem;}
th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--navy);color:var(--navy);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;}
td{padding:10px 8px;border-bottom:1px solid rgba(13,27,42,0.08);}
.ipe-badge{display:inline-block;font-weight:800;padding:3px 10px;border-radius:100px;font-size:0.78rem;}
.ipe-high{background:rgba(10,92,10,0.12);color:var(--green);}
.ipe-mid{background:rgba(249,195,0,0.15);color:#8a6d00;}
.ipe-low{background:rgba(206,17,38,0.1);color:var(--red);}
.summary{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
.summary-item{background:#f7f5ef;border-radius:10px;padding:14px 18px;flex:1;min-width:140px;}
.summary-item .num{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--navy);}
.summary-item .lbl{font-size:0.75rem;color:rgba(13,27,42,0.5);text-transform:uppercase;letter-spacing:0.04em;}
.empty{text-align:center;padding:40px 20px;color:rgba(13,27,42,0.4);font-size:0.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div id="loginStep" class="step show">
      <span style="color:var(--green);font-size:0.72rem;font-weight:700;text-transform:uppercase;">🔐 Accès administrateur</span>
      <h1>Tableau de bord DSSC</h1>
      <p class="sub">Connexion réservée aux comptes ADMIN.</p>
      <label for="phone">Numéro WhatsApp</label>
      <input type="tel" id="phone" placeholder="Ex : 675444463">
      <button id="sendOtpBtn">Recevoir mon code</button>

      <div id="otpBlock" style="display:none;">
        <label for="otpCode">Code reçu par SMS</label>
        <input type="text" id="otpCode" inputmode="numeric" placeholder="123456">
        <button id="verifyBtn">Se connecter</button>
      </div>
      <div class="msg error" id="loginError" style="display:none;"></div>
    </div>

    <div id="reportStep" class="step">
      <h1>Progression des élèves pilotes</h1>
      <p class="sub">Calculé en direct à partir des vraies tentatives enregistrées.</p>
      <div class="summary" id="summaryBlock"></div>
      <div id="tableBlock"></div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = 'https://TON-PROJET.supabase.co';
const SUPABASE_ANON_KEY = 'TON_ANON_KEY_ICI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function normalizePhone(raw) {
  let p = raw.trim().replace(/\s+/g, '');
  if (p.startsWith('+')) return p;
  if (p.startsWith('237')) return '+' + p;
  if (p.startsWith('0')) p = p.slice(1);
  return '+237' + p;
}

let currentPhone = '';

document.getElementById('sendOtpBtn').addEventListener('click', async () => {
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  const phoneRaw = document.getElementById('phone').value.trim();
  if (!phoneRaw) { err.textContent = 'Entre ton numéro.'; err.style.display = 'block'; return; }
  currentPhone = normalizePhone(phoneRaw);
  try {
    const { error } = await supabase.auth.signInWithOtp({ phone: currentPhone });
    if (error) throw error;
    document.getElementById('otpBlock').style.display = 'block';
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  }
});

document.getElementById('verifyBtn').addEventListener('click', async () => {
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  const code = document.getElementById('otpCode').value.trim();
  try {
    const { error } = await supabase.auth.verifyOtp({ phone: currentPhone, token: code, type: 'sms' });
    if (error) throw error;
    await loadReport();
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  }
});

async function loadReport() {
  const err = document.getElementById('loginError');
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error('Session invalide.');

    const res = await fetch('/api/admin-report', {
      headers: { 'Authorization': 'Bearer ' + session.access_token }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur de chargement');

    renderReport(data);
    document.getElementById('loginStep').classList.remove('show');
    document.getElementById('reportStep').classList.add('show');
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  }
}

function ipeClass(ipe) {
  if (ipe >= 65) return 'ipe-high';
  if (ipe >= 40) return 'ipe-mid';
  return 'ipe-low';
}

function renderReport(data) {
  const totalAttempts = data.students.reduce((s, st) => s + st.attemptsCount, 0);
  const avgIpe = data.students.length
    ? Math.round(data.students.reduce((s, st) => s + st.ipe, 0) / data.students.length)
    : 0;

  document.getElementById('summaryBlock').innerHTML = `
    <div class="summary-item"><div class="num">${data.totalStudents}</div><div class="lbl">Élèves</div></div>
    <div class="summary-item"><div class="num">${totalAttempts}</div><div class="lbl">Tentatives</div></div>
    <div class="summary-item"><div class="num">${avgIpe}</div><div class="lbl">IPE moyen</div></div>
  `;

  if (!data.students.length) {
    document.getElementById('tableBlock').innerHTML = '<p class="empty">Aucun élève pilote pour le moment.</p>';
    return;
  }

  const rows = data.students.map(s => `
    <tr>
      <td>${s.fullName}</td>
      <td>${s.phone}</td>
      <td>${s.attemptsCount}</td>
      <td><span class="ipe-badge ${ipeClass(s.ipe)}">${s.ipe} — ${s.palier}</span></td>
    </tr>
  `).join('');

  document.getElementById('tableBlock').innerHTML = `
    <table>
      <thead><tr><th>Élève</th><th>Téléphone</th><th>Tentatives</th><th>IPE</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
